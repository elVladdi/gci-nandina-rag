<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="4.4in" viewBox="0 0 1320 528">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#333"/></marker><marker id="redarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#A23B3B"/></marker></defs>
<rect width="1320" height="528" fill="white"/>
<text x="40" y="36" font-family="Arial" font-size="24" font-weight="700" fill="#222">Decision-support architecture and authority boundaries</text>
<text x="40" y="64" font-family="Arial" font-size="15" fill="#555">Primary flow fixes candidate authority before documentary evidence and explanation.</text>
<g font-family="Arial" font-size="13.5" fill="#222">
  <rect x="40" y="130" width="120" height="62" rx="10" fill="#F2F5F9" stroke="#6D7E91"/><text x="100" y="154" text-anchor="middle">Commercial</text><text x="100" y="174" text-anchor="middle">description</text>
  <rect x="190" y="130" width="120" height="62" rx="10" fill="#F2F5F9" stroke="#6D7E91"/><text x="250" y="154" text-anchor="middle">Query</text><text x="250" y="174" text-anchor="middle">normalization</text>
  <rect x="340" y="130" width="145" height="62" rx="10" fill="#EAF3E8" stroke="#4E8B45"/><text x="412.5" y="153" text-anchor="middle">Historical retrieval</text><text x="412.5" y="174" text-anchor="middle">and ranking</text>
  <rect x="515" y="130" width="145" height="62" rx="10" fill="#EAF3E8" stroke="#4E8B45"/><text x="587.5" y="153" text-anchor="middle">Unique candidate</text><text x="587.5" y="174" text-anchor="middle">construction</text>
  <rect x="690" y="122" width="122" height="78" rx="10" fill="#FFF4D6" stroke="#B98500" stroke-width="2"/><text x="751" y="152" text-anchor="middle" font-weight="700">FIXED</text><text x="751" y="174" text-anchor="middle" font-weight="700">TOP-3</text>
  <rect x="842" y="130" width="150" height="62" rx="10" fill="#F7EEF8" stroke="#8A5A91"/><text x="917" y="153" text-anchor="middle">Candidate-specific</text><text x="917" y="174" text-anchor="middle">documentary evidence</text>
  <rect x="1022" y="130" width="112" height="62" rx="10" fill="#F2F5F9" stroke="#6D7E91"/><text x="1078" y="153" text-anchor="middle">Context</text><text x="1078" y="174" text-anchor="middle">assembly</text>
  <rect x="1164" y="130" width="90" height="62" rx="10" fill="#F2F5F9" stroke="#6D7E91"/><text x="1209" y="153" text-anchor="middle">LLM</text><text x="1209" y="174" text-anchor="middle">explains</text>
</g>
<g stroke="#333" stroke-width="2" marker-end="url(#arrow)"><line x1="160" y1="161" x2="190" y2="161"/><line x1="310" y1="161" x2="340" y2="161"/><line x1="485" y1="161" x2="515" y2="161"/><line x1="660" y1="161" x2="690" y2="161"/><line x1="812" y1="161" x2="842" y2="161"/><line x1="992" y1="161" x2="1022" y2="161"/><line x1="1134" y1="161" x2="1164" y2="161"/></g>
<g font-family="Arial" font-size="14" fill="#333">
  <text x="340" y="230">Ranking authority: membership and order.</text>
  <text x="825" y="230">Evidence only: no rerank or replacement.</text>
  <text x="1008" y="255">LLM role: explanation only.</text>
</g>
<path d="M590,205 C590,300 910,300 910,205" fill="none" stroke="#A23B3B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#redarrow)"/>
<rect x="620" y="312" width="335" height="62" rx="10" fill="#FFF7F7" stroke="#A23B3B" stroke-dasharray="8 6"/>
<text x="787" y="337" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle" fill="#7A2424">Diagnostic reranker only</text>
<text x="787" y="359" font-family="Arial" font-size="13" text-anchor="middle" fill="#7A2424">separate route; no feedback to primary fixed Top-3</text>
<line x1="955" y1="343" x2="1035" y2="343" stroke="#A23B3B" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="490" font-family="Arial" font-size="13" fill="#555">Authority contract: downstream stages enrich and explain the fixed candidates; they do not alter the ranking.</text>
</svg>
